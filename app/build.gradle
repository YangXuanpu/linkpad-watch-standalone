plugins {
    id 'com.android.application'
}
android {
    namespace 'com.linkpad.watch'
    compileSdk 35
    defaultConfig {
        applicationId 'com.linkpad.watch'
        minSdk 28
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { debug { debuggable true } }
}
